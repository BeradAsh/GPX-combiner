<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPX Combiner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#eef2f1;--panel:#fff;--ink:#17262b;--mute:#5c6f75;--line:#d3dcdb;--accent:#14705c}
@media (prefers-color-scheme:dark){:root{--bg:#10191c;--panel:#182327;--ink:#e6eeee;--mute:#8da0a5;--line:#2a3a3f;--accent:#4fc3a1}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex}
aside{width:340px;max-width:42vw;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:1000}
header{padding:18px 18px 12px}
h1{font-size:1.35rem;margin:0 0 4px;letter-spacing:-.01em}
header p{margin:0;color:var(--mute);font-size:.85rem;line-height:1.4}
#drop{margin:0 18px;border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;cursor:pointer;color:var(--mute);font-size:.9rem}
#drop.over,#drop:hover,#drop:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
#drop strong{color:var(--ink)}
#list{flex:1;overflow:auto;padding:12px 18px;margin:0;list-style:none}
#list li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.88rem}
#list input[type=color]{width:26px;height:26px;border:0;padding:0;background:none;cursor:pointer;flex:none}
.name{flex:1;min-width:0;cursor:pointer}
.name b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.name small{color:var(--mute)}
li button{border:0;background:none;color:var(--mute);cursor:pointer;font-size:1.1rem;padding:4px 6px;border-radius:6px}
li button:hover{color:var(--ink);background:var(--bg)}
.empty{color:var(--mute);font-size:.88rem;border:0!important;display:block!important}
footer{padding:14px 18px;border-top:1px solid var(--line);display:grid;gap:10px}
label.opt{display:flex;gap:8px;align-items:flex-start;font-size:.82rem;color:var(--mute);line-height:1.35}
.btns{display:flex;gap:8px}
.btn{flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,li button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#mapwrap{flex:1;height:100%;position:relative;min-width:0}
#map{position:absolute;inset:0}
#profile{position:absolute;left:12px;right:12px;bottom:24px;z-index:1100;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 14px 6px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.phead{display:flex;align-items:center;gap:8px}
#pswatch{width:12px;height:12px;border-radius:3px;flex:none}
#ptitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pread{font-size:.82rem;color:var(--mute);font-variant-numeric:tabular-nums}
#pclose{border:0;background:none;color:var(--mute);cursor:pointer;font-size:1.1rem;padding:4px 8px;border-radius:6px}
#pclose:hover{color:var(--ink);background:var(--bg)}
#pclose:focus-visible{outline:2px solid var(--accent)}
#pstats{display:flex;flex-wrap:wrap;gap:2px 18px;font-size:.82rem;color:var(--mute);margin:4px 0 2px}
#pstats b{color:var(--ink)}
#pchart svg{display:block;width:100%}
.pnone{margin:10px 0 14px;font-size:.85rem;color:var(--mute)}
.pbody{display:flex;gap:16px;align-items:stretch}
.pleft{flex:1;min-width:0}
.pright{width:300px;flex:none;border-left:1px solid var(--line);padding:0 0 6px 16px;max-height:270px;overflow:auto;font-size:.82rem}
.pright h3{margin:2px 0 8px;font-size:.9rem}
.kv{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.kv dt{color:var(--mute);font-size:.75rem}
.kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.pnote{margin:10px 0 4px;color:var(--mute);font-size:.75rem;line-height:1.4;background:var(--bg);padding:6px 8px;border-radius:6px}
.splits{width:100%;border-collapse:collapse;margin-top:10px;font-variant-numeric:tabular-nums}
.splits th{text-align:left;color:var(--mute);font-weight:500;font-size:.75rem;padding:2px 4px;position:sticky;top:0;background:var(--panel)}
.splits td{padding:2px 4px}
.splits td:last-child{width:34%}
.splits .bar{display:block;height:6px;border-radius:3px;background:var(--accent);opacity:.7}
@media (max-width:700px){#profile{max-height:80%;overflow:auto}.pbody{flex-direction:column;gap:8px}.pright{width:auto;max-height:none;border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:8px}}
.grid{stroke:var(--line);stroke-width:1}
.ax{fill:var(--mute);font-size:11px}
.cur{stroke:var(--mute);stroke-dasharray:3 3}
.keyrow{display:flex;gap:8px;margin:12px 18px 6px}
.keyrow input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.85rem}
.keyrow input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.keyrow .btn{flex:none;padding:8px 12px;font-size:.85rem}
.dimrow{display:flex;align-items:center;gap:8px;margin:6px 18px;font-size:.82rem;color:var(--mute)}
.dimrow input{flex:1;min-width:0;accent-color:var(--accent)}
.dimrow span{width:3em;text-align:right}
#msg{font-size:.8rem;color:#b3372b;min-height:1em;padding:0 18px}
@media (max-width:700px){body{flex-direction:column-reverse}aside{width:100%;max-width:none;height:48%;border-right:0;border-top:1px solid var(--line)}#mapwrap{height:52%}}
</style>
</head>
<body>
<aside>
  <header>
    <h1>GPX Combiner</h1>
    <p>Add several GPX files, see them on one map, then download a single combined file.</p>
  </header>
  <div id="drop" tabindex="0" role="button" aria-label="Add GPX files"><strong>Drop GPX files here</strong><br>or click to choose files</div>
  <input id="file" type="file" accept=".gpx,application/gpx+xml,text/xml" multiple hidden>
  <div class="keyrow">
    <input id="key" type="text" placeholder="CARTO API key" aria-label="CARTO API key" autocomplete="off" spellcheck="false">
    <button class="btn" id="saveKey" type="button">Apply key</button>
  </div>
  <div class="dimrow">
    <label for="dim">Map dimming</label>
    <input id="dim" type="range" min="0" max="100" value="55">
    <span id="dimv">55%</span>
  </div>
  <div id="msg" role="status"></div>
  <ul id="list"><li class="empty">No files yet.</li></ul>
  <footer>
    <label class="opt"><input type="checkbox" id="merge"> Join all tracks into one continuous track (in list order)</label>
    <label class="opt"><input type="checkbox" id="keepColors" checked> Keep each file's colour in the combined GPX (needs separate tracks)</label>
    <div class="btns">
      <button class="btn" id="clear" disabled>Clear all</button>
      <button class="btn primary" id="export" disabled>Download combined GPX</button>
    </div>
  </footer>
</aside>
<div id="mapwrap">
  <div id="map"></div>
  <section id="profile" aria-label="Elevation profile" style="display:none">
    <div class="phead"><span id="pswatch"></span><strong id="ptitle"></strong><span id="pread"></span>
      <button id="pclose" type="button" aria-label="Close elevation profile">✕</button></div>
    <div class="pbody">
      <div class="pleft">
        <div id="pstats"></div>
        <div id="pchart"></div>
      </div>
      <div class="pright" id="ptime"></div>
    </div>
  </section>
</div>

<script>
const map = L.map('map').setView([51.5, -0.12], 6);
// CARTO API key: you can paste it into the box in the sidebar, or hard-code it here.
const CARTO_KEY_FALLBACK = '';
function getKey() { try { return localStorage.getItem('cartoKey') || CARTO_KEY_FALLBACK; } catch (e) { return CARTO_KEY_FALLBACK; } }
function cartoUrl(k) { return 'https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png' + (k ? '?key=' + encodeURIComponent(k) : ''); }
const osmAttr = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
const baseLayers = {
  'Streets (CARTO)': L.tileLayer(cartoUrl(getKey()), {
    maxZoom: 20, attribution: osmAttr + ' &copy; <a href="https://carto.com/attributions">CARTO</a>'
  }),
  'Topo (Esri)': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, attribution: 'Tiles &copy; Esri'
  }),
  'Satellite + place names (Esri)': L.layerGroup([
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19, attribution: 'Tiles &copy; Esri'
    }),
    // Country, city and boundary labels drawn on top of the imagery
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19, zIndex: 2
    })
  ]),
  'OpenStreetMap': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: osmAttr
  })
};
const orderedLayers = {};
['OpenStreetMap', 'Satellite + place names (Esri)', 'Streets (CARTO)', 'Topo (Esri)'].forEach(k => orderedLayers[k] = baseLayers[k]);
baseLayers['OpenStreetMap'].addTo(map);
L.control.layers(orderedLayers, null, {position: 'topright'}).addTo(map);
const keyBox = document.getElementById('key');
keyBox.value = getKey();
document.getElementById('saveKey').onclick = () => {
  const k = keyBox.value.trim();
  try { k ? localStorage.setItem('cartoKey', k) : localStorage.removeItem('cartoKey'); } catch (e) {}
  baseLayers['Streets (CARTO)'].setUrl(cartoUrl(k));
  document.getElementById('msg').textContent = k ? 'CARTO key applied. If you still see a watermark, force-refresh (Ctrl/Cmd+Shift+R).' : 'CARTO key cleared.';
};

const palette = ['#e6194b','#3a6fe0','#f58231','#2a9d4a','#911eb4','#0aa5b8','#d6a400','#c2185b','#6d4c41','#546e7a'];
let items = []; // {id,name,color,group,waypoints,tracks,routes,visible,points,km}
let nextId = 1;
const $ = id => document.getElementById(id);

function dist(a, b) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b[0]-a[0])*rad, dLon = (b[1]-a[1])*rad;
  const h = Math.sin(dLat/2)**2 + Math.cos(a[0]*rad)*Math.cos(b[0]*rad)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const pt = el => ({lat: +el.getAttribute('lat'), lon: +el.getAttribute('lon'),
  ele: el.getElementsByTagName('ele')[0]?.textContent, time: el.getElementsByTagName('time')[0]?.textContent,
  name: el.getElementsByTagName('name')[0]?.textContent});
const kids = (el, tag) => [...el.children].filter(c => c.localName === tag);

function parseGpx(text, fileName) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('not valid XML');
  const root = doc.documentElement;
  if (root.localName !== 'gpx') throw new Error('not a GPX file');
  const tracks = kids(root, 'trk').map((t, i) => ({
    name: kids(t, 'name')[0]?.textContent || fileName.replace(/\.gpx$/i, '') + (i ? ' ' + (i+1) : ''),
    segments: kids(t, 'trkseg').map(s => kids(s, 'trkpt').map(pt))
  }));
  const routes = kids(root, 'rte').map((r, i) => ({
    name: kids(r, 'name')[0]?.textContent || fileName.replace(/\.gpx$/i, '') + ' route' + (i ? ' ' + (i+1) : ''),
    points: kids(r, 'rtept').map(pt)
  }));
  const waypoints = kids(root, 'wpt').map(pt);
  if (!tracks.length && !routes.length && !waypoints.length) throw new Error('no tracks, routes or waypoints');
  return {tracks, routes, waypoints};
}

function draw(item) {
  if (item.group) map.removeLayer(item.group);
  const g = L.featureGroup(), opt = {color: item.color, weight: 4, opacity: .85};
  let km = 0, n = 0;
  item.tracks.forEach(t => t.segments.forEach(seg => {
    const ll = seg.map(p => [p.lat, p.lon]);
    ll.forEach((p, i) => { n++; if (i) km += dist(ll[i-1], p); });
    if (ll.length) L.polyline(ll, opt).bindTooltip(t.name, {sticky: true})
      .on('click', () => showProfile(item, t.name, t.segments.flat())).addTo(g);
  }));
  item.routes.forEach(r => {
    const ll = r.points.map(p => [p.lat, p.lon]);
    ll.forEach((p, i) => { n++; if (i) km += dist(ll[i-1], p); });
    if (ll.length) L.polyline(ll, {...opt, dashArray: '8 6'}).bindTooltip(r.name, {sticky: true})
      .on('click', () => showProfile(item, r.name, r.points)).addTo(g);
  });
  item.waypoints.forEach(w => L.circleMarker([w.lat, w.lon], {radius: 6, color: '#fff', weight: 2, fillColor: item.color, fillOpacity: 1})
    .bindTooltip(w.name || 'Waypoint').addTo(g));
  item.group = g; item.points = n; item.km = km;
  if (item.visible) g.addTo(map);
}

function fit() {
  const gs = items.filter(i => i.visible && i.group);
  if (!gs.length) return;
  const b = L.featureGroup(gs.map(i => i.group)).getBounds();
  if (b.isValid()) map.fitBounds(b, {padding: [30, 30]});
}

function render() {
  const ul = $('list');
  ul.innerHTML = '';
  if (!items.length) ul.innerHTML = '<li class="empty">No files yet.</li>';
  items.forEach(it => {
    const li = document.createElement('li');
    li.innerHTML = `<input type="color" value="${it.color}" aria-label="Colour for ${it.name}">
      <div class="name" title="Zoom to this file"><b></b><small>${it.km.toFixed(1)} km · ${it.points} points${it.waypoints.length ? ' · ' + it.waypoints.length + ' waypoints' : ''}</small></div>
      <button class="vis" aria-label="Toggle visibility">${it.visible ? '👁' : '◌'}</button>
      <button class="del" aria-label="Remove ${it.name}">✕</button>`;
    li.querySelector('b').textContent = it.name;
    li.querySelector('input').oninput = e => {
      it.color = e.target.value; draw(it);
      if (prof.item === it) { prof.color = it.color; $('pswatch').style.background = it.color; renderProfile(); }
    };
    li.querySelector('.name').onclick = () => { if (it.group) map.fitBounds(it.group.getBounds(), {padding: [30, 30]}); };
    li.querySelector('.vis').onclick = () => {
      it.visible = !it.visible; it.visible ? it.group.addTo(map) : map.removeLayer(it.group);
      if (!it.visible && prof.item === it) hideProfile();
      render();
    };
    li.querySelector('.del').onclick = () => {
      if (prof.item === it) hideProfile();
      map.removeLayer(it.group); items = items.filter(x => x !== it); render();
    };
    ul.appendChild(li);
  });
  $('export').disabled = $('clear').disabled = !items.length;
}

async function addFiles(fileList) {
  const errors = [];
  for (const f of fileList) {
    try {
      const data = parseGpx(await f.text(), f.name);
      const item = {id: nextId++, name: f.name, color: palette[(nextId - 2) % palette.length], visible: true, ...data};
      draw(item); items.push(item);
    } catch (e) { errors.push(`${f.name}: ${e.message}`); }
  }
  $('msg').textContent = errors.length ? 'Skipped ' + errors.join('; ') : '';
  render(); fit();
}

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const ptXml = (p, tag, ind) => `${ind}<${tag} lat="${p.lat}" lon="${p.lon}">` +
  (p.ele != null ? `<ele>${esc(p.ele)}</ele>` : '') + (p.time ? `<time>${esc(p.time)}</time>` : '') +
  (p.name ? `<name>${esc(p.name)}</name>` : '') + `</${tag}>\n`;

// Garmin's extension only allows these 16 named colours, so we send the nearest one.
const GARMIN = {Black:[0,0,0],DarkRed:[139,0,0],DarkGreen:[0,100,0],DarkYellow:[139,139,0],DarkBlue:[0,0,139],DarkMagenta:[139,0,139],
  DarkCyan:[0,139,139],LightGray:[211,211,211],DarkGray:[105,105,105],Red:[255,0,0],Green:[0,255,0],Yellow:[255,255,0],
  Blue:[0,0,255],Magenta:[255,0,255],Cyan:[0,255,255],White:[255,255,255]};
function garminName(hex) {
  const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  let best = 'Red', bd = Infinity;
  for (const [n, v] of Object.entries(GARMIN)) {
    const d = (v[0]-c[0])**2 + (v[1]-c[1])**2 + (v[2]-c[2])**2;
    if (d < bd) { bd = d; best = n; }
  }
  return best;
}
function colorExt(hex, kind, ind) {
  const rgb = hex.slice(1).toUpperCase(), g = garminName(hex), tag = kind === 'trk' ? 'TrackExtension' : 'RouteExtension';
  return `${ind}<extensions>\n` +
    `${ind}  <gpxx:${tag}><gpxx:DisplayColor>${g}</gpxx:DisplayColor></gpxx:${tag}>\n` +
    `${ind}  <gpx_style:line><gpx_style:color>${rgb}</gpx_style:color></gpx_style:line>\n` +
    `${ind}  <osmand:color>#${rgb.toLowerCase()}</osmand:color>\n` +
    `${ind}</extensions>\n`;
}

function buildGpx() {
  const merge = $('merge').checked, keep = $('keepColors').checked && !merge;
  let wpts = '', rtes = '', trks = '';
  const all = items; // include hidden ones too
  all.forEach(it => {
    it.waypoints.forEach(w => wpts += ptXml(w, 'wpt', '  '));
    it.routes.forEach(r => rtes += `  <rte>\n    <name>${esc(r.name)}</name>\n` + (keep ? colorExt(it.color, 'rte', '    ') : '') + r.points.map(p => ptXml(p, 'rtept', '    ')).join('') + `  </rte>\n`);
    if (!merge) it.tracks.forEach(t => trks += `  <trk>\n    <name>${esc(t.name)}</name>\n` + (keep ? colorExt(it.color, 'trk', '    ') : '') +
      t.segments.map(s => `    <trkseg>\n` + s.map(p => ptXml(p, 'trkpt', '      ')).join('') + `    </trkseg>\n`).join('') + `  </trk>\n`);
  });
  if (merge) {
    const segs = [];
    all.forEach(it => it.tracks.forEach(t => t.segments.forEach(s => s.length && segs.push(s))));
    if (segs.length) trks = `  <trk>\n    <name>Combined track</name>\n` +
      segs.map(s => `    <trkseg>\n` + s.map(p => ptXml(p, 'trkpt', '      ')).join('') + `    </trkseg>\n`).join('') + `  </trk>\n`;
  }
  const ns = keep ? ' xmlns:gpxx="http://www.garmin.com/xmlschemas/GpxExtensions/v3" xmlns:gpx_style="http://www.topografix.com/GPX/gpx_style/0/2" xmlns:osmand="https://osmand.net"' : '';
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="GPX Combiner" xmlns="http://www.topografix.com/GPX/1/1"${ns}>\n` +
    `  <metadata><name>Combined GPX</name><time>${new Date().toISOString()}</time></metadata>\n${wpts}${rtes}${trks}</gpx>\n`;
}

$('merge').onchange = () => { $('keepColors').disabled = $('merge').checked; };

$('export').onclick = () => {
  const blob = new Blob([buildGpx()], {type: 'application/gpx+xml'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'combined.gpx';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('clear').onclick = () => { hideProfile(); items.forEach(i => map.removeLayer(i.group)); items = []; $('msg').textContent = ''; render(); };

const drop = $('drop'), input = $('file');
drop.onclick = () => input.click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } };
input.onchange = () => { addFiles([...input.files]); input.value = ''; };
['dragenter', 'dragover'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
window.addEventListener('drop', e => addFiles([...e.dataTransfer.files].filter(f => /\.gpx$|xml$/i.test(f.name))));

// ---------- Elevation profile ----------
const prof = {item: null, color: '#14705c', data: [], total: 0, marker: null};
const niceStep = s => { const e = 10 ** Math.floor(Math.log10(s)), f = s / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e; };

function showProfile(item, name, pts) {
  let d = 0; const data = [];
  pts.forEach((p, i) => {
    if (i) d += dist([pts[i-1].lat, pts[i-1].lon], [p.lat, p.lon]);
    const e = parseFloat(p.ele);
    if (isFinite(e)) data.push({d, e, lat: p.lat, lon: p.lon});
  });
  Object.assign(prof, {item, color: item.color, data, total: d});
  $('ptitle').textContent = name;
  $('pswatch').style.background = item.color;
  $('pread').textContent = '';
  $('profile').style.display = 'block';
  renderTime(pts);
  renderProfile();
}

function hideProfile() {
  $('profile').style.display = 'none';
  prof.item = null;
  if (prof.marker) { map.removeLayer(prof.marker); prof.marker = null; }
}

function renderProfile() {
  const box = $('pchart'), stats = $('pstats'), {data, total, color} = prof;
  box.innerHTML = '';
  const km = `<span><b>${total.toFixed(2)} km</b> total distance</span>`;
  if (data.length < 2) { stats.innerHTML = km; box.innerHTML = '<p class="pnone">This path has no elevation data.</p>'; return; }
  const es = data.map(p => p.e), min = Math.min(...es), max = Math.max(...es);
  const sm = es.map((_, i) => { let s = 0, n = 0; for (let j = Math.max(0, i - 2); j <= Math.min(es.length - 1, i + 2); j++) { s += es[j]; n++; } return s / n; });
  let gain = 0; for (let i = 1; i < sm.length; i++) if (sm[i] > sm[i-1]) gain += sm[i] - sm[i-1];
  stats.innerHTML = km + `<span><b>${Math.round(max)} m</b> highest</span><span><b>${Math.round(min)} m</b> lowest</span><span><b>${Math.round(gain)} m</b> climbed</span>`;

  const W = box.clientWidth || 600, H = innerWidth < 700 ? 120 : 170, m = {l: 54, r: 14, t: 8, b: 24};
  const iw = W - m.l - m.r, ih = H - m.t - m.b, T = total || 1;
  const pad = Math.max((max - min) * .1, 5), lo = min - pad, hi = max + pad;
  const X = d => m.l + d / T * iw, Y = e => m.t + (1 - (e - lo) / (hi - lo)) * ih;
  const stepN = Math.ceil(data.length / 1500), pts = data.filter((_, i) => i % stepN === 0 || i === data.length - 1);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(p.d).toFixed(1) + ',' + Y(p.e).toFixed(1)).join('');
  const area = line + `L${X(pts[pts.length-1].d).toFixed(1)},${m.t + ih}L${X(pts[0].d).toFixed(1)},${m.t + ih}Z`;
  let grid = '';
  const ys = niceStep((hi - lo) / 4);
  for (let v = Math.ceil(lo / ys) * ys; v <= hi; v += ys)
    grid += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${Math.round(v)} m</text>`;
  const xs = niceStep(T / 6);
  for (let v = 0; v <= T + 1e-9; v += xs)
    grid += `<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="${m.t}" y2="${m.t + ih}"/><text class="ax" x="${X(v)}" y="${H - 6}" text-anchor="${v === 0 ? 'start' : 'middle'}">${+v.toFixed(2)} km</text>`;

  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Elevation profile">${grid}` +
    `<path d="${area}" fill="${color}" fill-opacity=".18"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>` +
    `<line id="pcur" class="cur" y1="${m.t}" y2="${m.t + ih}" style="display:none"/>` +
    `<circle id="pdot" r="4" fill="${color}" stroke="#fff" stroke-width="1.5" style="display:none"/>` +
    `<rect id="phit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;

  const svg = box.querySelector('svg'), cur = $('pcur'), dot = $('pdot'), hit = $('phit');
  hit.addEventListener('pointermove', ev => {
    const r = svg.getBoundingClientRect();
    const d = Math.min(Math.max((ev.clientX - r.left) * (W / r.width) - m.l, 0), iw) / iw * T;
    let best = pts[0]; for (const p of pts) if (Math.abs(p.d - d) < Math.abs(best.d - d)) best = p;
    cur.setAttribute('x1', X(best.d)); cur.setAttribute('x2', X(best.d)); cur.style.display = '';
    dot.setAttribute('cx', X(best.d)); dot.setAttribute('cy', Y(best.e)); dot.style.display = '';
    $('pread').textContent = `${best.d.toFixed(2)} km · ${Math.round(best.e)} m`;
    if (!prof.marker) prof.marker = L.circleMarker([best.lat, best.lon], {radius: 7, color: '#fff', weight: 2, fillColor: prof.color, fillOpacity: 1, interactive: false}).addTo(map);
    else prof.marker.setLatLng([best.lat, best.lon]);
  });
  hit.addEventListener('pointerleave', () => {
    cur.style.display = 'none'; dot.style.display = 'none'; $('pread').textContent = '';
    if (prof.marker) { map.removeLayer(prof.marker); prof.marker = null; }
  });
}

// ---------- Time data (right section) ----------
function fmtDur(s) {
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60, p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(sec)}` : `${m}:${p(sec)}`;
}
const fmtPace = s => isFinite(s) && s > 0 ? fmtDur(s) + ' /km' : '–';
const fmtStamp = sec => new Date(sec * 1000).toLocaleString(undefined, {dateStyle: 'medium', timeStyle: 'medium'});

function renderTime(pts) {
  const el = $('ptime');
  const note = '<p class="pnote">Note: your GPX file might not contain this type of data (planned routes, for example, usually have no timestamps), so some or all of this information may not be displayed.</p>';
  let d = 0; const timed = [];
  pts.forEach((p, i) => {
    if (i) d += dist([pts[i-1].lat, pts[i-1].lon], [p.lat, p.lon]);
    const t = Date.parse(p.time);
    if (isFinite(t)) timed.push({d, t: t / 1000});
  });
  const t0 = timed[0], t1 = timed[timed.length - 1];
  if (timed.length < 2 || t1.t <= t0.t) {
    el.innerHTML = '<h3>Time &amp; pace</h3><p class="pnone">No timestamps found for this path.</p>' + note;
    return;
  }
  const elapsed = t1.t - t0.t, timedDist = t1.d - t0.d;

  // Moving vs stopped: a stretch counts as moving if speed >= 1 km/h; gaps over 10 min count as stopped (paused recording).
  let moving = 0, movingDist = 0;
  for (let i = 1; i < timed.length; i++) {
    const dt = timed[i].t - timed[i-1].t, dd = timed[i].d - timed[i-1].d;
    if (dt > 0 && dt <= 600 && dd / dt * 3600 >= 1) { moving += dt; movingDist += dd; }
  }

  // Per-km splits (elapsed time, interpolated between points)
  const splits = []; let j = 1, prevT = t0.t;
  const timeAt = rel => {
    const target = t0.d + rel;
    while (j < timed.length - 1 && timed[j].d < target) j++;
    const a = timed[j-1], b = timed[j];
    return b.d === a.d ? b.t : a.t + (b.t - a.t) * (target - a.d) / (b.d - a.d);
  };
  const full = Math.floor(timedDist);
  for (let k = 1; k <= full; k++) { const t = timeAt(k); splits.push({label: k, sec: t - prevT, pace: t - prevT}); prevT = t; }
  const rest = timedDist - full;
  if (rest >= 0.05) splits.push({label: `${full + 1} (${rest.toFixed(2)} km)`, sec: t1.t - prevT, pace: (t1.t - prevT) / rest});
  const fastest = Math.min(...splits.map(s => s.pace));

  const row = (k, v) => `<div><dt>${k}</dt><dd>${v}</dd></div>`;
  el.innerHTML = '<h3>Time &amp; pace</h3><dl class="kv">' +
    row('Started', fmtStamp(t0.t)) + row('Finished', fmtStamp(t1.t)) +
    row('Elapsed time', fmtDur(elapsed)) + row('Moving time', moving ? fmtDur(moving) : '–') +
    row('Stopped time', fmtDur(Math.max(0, elapsed - moving))) +
    row('Avg. pace (moving)', fmtPace(moving / movingDist)) +
    row('Avg. pace (overall)', fmtPace(elapsed / timedDist)) + '</dl>' +
    (splits.length ? '<table class="splits"><thead><tr><th>Km</th><th>Time</th><th>Pace</th><th></th></tr></thead><tbody>' +
      splits.map(s => `<tr><td>${s.label}</td><td>${fmtDur(s.sec)}</td><td>${fmtDur(s.pace)}</td><td><span class="bar" style="width:${Math.max(8, fastest / s.pace * 100).toFixed(0)}%"></span></td></tr>`).join('') +
      '</tbody></table>' : '') + note;
}

$('pclose').onclick = hideProfile;
L.DomEvent.disableClickPropagation($('profile'));
L.DomEvent.disableScrollPropagation($('profile'));
addEventListener('keydown', e => { if (e.key === 'Escape') hideProfile(); });
addEventListener('resize', () => { if (prof.item) renderProfile(); });

// Dim only the map tiles (tilePane); tracks live in other panes and stay fully coloured.
function applyDim(v, save) {
  const s = v / 100;
  map.getPane('tilePane').style.filter = v > 0 ? `grayscale(${s}) brightness(${1 - 0.3 * s}) contrast(${1 - 0.15 * s})` : '';
  $('dimv').textContent = v + '%';
  if (save) { try { localStorage.setItem('mapDim', v); } catch (e) {} }
}
let savedDim = 55;
try { const d = localStorage.getItem('mapDim'); if (d !== null) savedDim = +d; } catch (e) {}
$('dim').value = savedDim;
applyDim(savedDim, false);
$('dim').oninput = e => applyDim(+e.target.value, true);
</script>
</body>
